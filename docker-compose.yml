services:
  postgres-email-preparation:
    image: postgres:17
    container_name: postgres-email-preparation
    environment:
      POSTGRES_DB: emailpreparation
      POSTGRES_USER: ${POSTGRES_PREPARATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PREPARATION_PASSWORD}
    volumes:
      - pgdata-email-preparation:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-letter-constructor:
    image: postgres:17
    container_name: postgres-letter-constructor
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: letterconstructor
      POSTGRES_USER: ${POSTGRES_CONSTRUCTOR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CONSTRUCTOR_PASSWORD}
    volumes:
      - pgdata-letter-constructor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-mail-sender:
    image: postgres:17
    container_name: postgres-mail-sender
    environment:
      POSTGRES_DB: mailsender
      POSTGRES_USER: ${POSTGRES_MAIL_SENDER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIL_SENDER_PASSWORD}
    volumes:
      - pgdata-mail-sender:/var/lib/postgresql-mail-sender/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  letter-constructor:
    container_name: letter-constructor
    build:
      context: ./LetterConstructor
      dockerfile: ConstructorApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres-letter-constructor;Port=5432;Database=letterconstructor;Username=${POSTGRES_CONSTRUCTOR_USER};Password=${POSTGRES_CONSTRUCTOR_PASSWORD}
    depends_on:
      postgres-letter-constructor:
        condition: service_healthy
    restart: unless-stopped

  email-preparation:
    container_name: email-preparation
    build:
      context: ./EmailPreparation
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres-email-preparation;Port=5432;Database=emailpreparation;Username=${POSTGRES_PREPARATION_USER};Password=${POSTGRES_PREPARATION_PASSWORD}
    depends_on:
      postgres-email-preparation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  publisher:
    build:
      context: ./Publisher
      dockerfile: Dockerfile
    depends_on:
      email-preparation:
        condition: service_healthy
      postgres-email-preparation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres-email-preparation;Port=5432;Database=emailpreparation;Username=${POSTGRES_PREPARATION_USER};Password=${POSTGRES_PREPARATION_PASSWORD}
      RABBIT__HOST: rabbitmq
      RABBIT__USER: ${RABBITMQ_DEFAULT_USER}
      RABBIT__PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBIT__EXCHANGE: ${MAIL_SENDER_EXCHANGE:-mail.send}
      RABBIT__QUEUE: ${MAIL_SENDER_QUEUE:-mail.send.q}
      RABBIT__ROUTINGKEY: ${MAIL_SENDER_ROUTING_KEY:-send}
      RABBIT__RETRYEXCHANGE: ${MAIL_SENDER_RETRY_EXCHANGE:-mail.send.retry}
      RABBIT__RETRYROUTINGKEY: ${MAIL_SENDER_RETRY_ROUTING_KEY:-send.retry}
    restart: unless-stopped

  mail-sender:
    build:
      context: ./MailSender
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres-mail-sender:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres-mail-sender;Port=5432;Database=${POSTGRES_DB:-mailsender};Username=${POSTGRES_MAIL_SENDER_USER};Password=${POSTGRES_MAIL_SENDER_PASSWORD}

      RABBIT__HOST: rabbitmq
      RABBIT__PORT: "5672"
      RABBIT__USER: ${RABBITMQ_DEFAULT_USER}
      RABBIT__PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBIT__EXCHANGE: ${MAIL_SENDER_EXCHANGE:-mail.send}
      RABBIT__QUEUE: ${MAIL_SENDER_QUEUE:-mail.send.q}
      RABBIT__ROUTINGKEY: ${MAIL_SENDER_ROUTING_KEY:-send}
      RABBIT__RETRYEXCHANGE: ${MAIL_SENDER_RETRY_EXCHANGE:-mail.send.retry}
      RABBIT__RETRYQUEUE: ${MAIL_SENDER_RETRY_QUEUE:-mail.send.retry.q}
      RABBIT__RETRYROUTINGKEY: ${MAIL_SENDER_RETRY_ROUTING_KEY:-send.retry}
      RABBIT__DEADLETTEREXCHANGE: ${MAIL_SENDER_DLX_EXCHANGE:-mail.send.dlx}
      RABBIT__DEADLETTERQUEUE: ${MAIL_SENDER_DLX_QUEUE:-mail.send.dlq}
      RABBIT__DEADLETTERROUTINGKEY: ${MAIL_SENDER_DLX_ROUTING_KEY:-send.dlq}
      RABBIT__CONSUMERS: "${MAIL_SENDER_CONSUMERS:-5}"
      RABBIT__PREFETCH: "${MAIL_SENDER_PREFETCH:-20}"


      OUTBOX__BATCHSIZE: "${MAIL_SENDER_BATCH_SIZE:-200}"
      OUTBOX__POLLINTERVALMILLISECONDS: "${MAIL_SENDER_POLL_INTERVAL_MS:-500}"
      OUTBOX__PUBLISHLEASESECONDS: "${MAIL_SENDER_PUBLISH_LEASE_SECONDS:-30}"
      OUTBOX__DELIVERYLEASESECONDS: "${MAIL_SENDER_DELIVERY_LEASE_SECONDS:-120}"
      OUTBOX__RETRYDELAYSECONDS: "${MAIL_SENDER_RETRY_DELAY_SECONDS:-30}"
      OUTBOX__MAXDELIVERYATTEMPTS: "${MAIL_SENDER_MAX_DELIVERY_ATTEMPTS:-5}"
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - email-preparation
      - letter-constructor
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./ApiGateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ApiGateway/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - email-preparation
      - letter-constructor
      - frontend
    restart: unless-stopped

volumes:
  pgdata-mail-sender:
  pgdata-email-preparation:
  pgdata-letter-constructor:
  rabbitmqdata:
