<aside class="sidebar">
  <header class="sidebar-header">
    <mat-icon>folder</mat-icon>
    <span class="sidebar-title">База файлов</span>
  </header>

  <div class="files-list">
    @if (loading) {
      <div class="empty-state">Загрузка...</div>
    } @else if (files.length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-icon">inbox</mat-icon>
        <span>Пока нет сохранённых файлов</span>
      </div>
    } @else {
      @for (file of files; track file.id) {
        <div class="file-item">
          <mat-icon class="file-icon">description</mat-icon>
          <div class="file-info">
            <div class="file-name" [title]="file.name">{{ file.name }}</div>
            <div class="file-date">{{ file.createdAt | date:'dd.MM.yyyy HH:mm' }}</div>
          </div>
          <span class="file-type-badge" [class.type-template]="file.type === 'Template'">
            {{ file.type === 'Template' ? 'Шаблон' : 'Блок' }}
          </span>
          <button
            class="file-action file-load"
            type="button"
            matTooltip="Добавить блок из файла"
            (click)="fileLoad.emit(file)">
            <mat-icon>file_download</mat-icon>
          </button>
          <button
            class="file-action file-delete"
            type="button"
            matTooltip="Удалить файл"
            (click)="fileDelete.emit(file)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      }
    }
  </div>
</aside>
