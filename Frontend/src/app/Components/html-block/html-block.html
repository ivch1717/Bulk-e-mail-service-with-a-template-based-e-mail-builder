<div class="block">
  <div class="drag-handle" cdkDragHandle>
    <mat-icon class="drag-icon">drag_indicator</mat-icon>
    <span class="drag-label">Перетащить</span>
  </div>

  <textarea class="code"
            #ta
            [ngModel]="text"
            (ngModelChange)="textChange.emit($event)"
            (input)="autoGrow($event)"
            (focus)="onFocus()"
            (blur)="onBlur()">
  </textarea>
</div>
